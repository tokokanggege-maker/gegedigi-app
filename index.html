<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GegeDigi Image Utility</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">
  <header class="bg-blue-600 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-wide">gegedigi.com</h1>
        <p class="text-xs text-blue-100">Utilitas Gambar Cepat & Offline</p>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 flex-1 w-full">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-lg font-bold mb-4 text-slate-800">Pengubah & Pengompres Gambar Instan</h2>

      <div class="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center hover:border-blue-500 transition cursor-pointer mb-6" id="dropArea">
        <input type="file" id="fileInput" accept="image/*" class="hidden" />
        <p class="text-slate-600 font-medium">Klik di sini atau seret foto ke dalam kotak</p>
        <p class="text-xs text-slate-400 mt-1">Mendukung format JPG, PNG, WebP</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Format Output</label>
          <select id="formatSelect" class="w-full border rounded-lg p-2 text-sm bg-white">
            <option value="image/jpeg">JPG / JPEG</option>
            <option value="image/png">PNG</option>
            <option value="image/webp">WebP (Ukuran Paling Ringan)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Lebar Baru (Pixel)</label>
          <input type="number" id="widthInput" placeholder="Sesuai Asli" class="w-full border rounded-lg p-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Kualitas: <span id="qualityLabel">80%</span></label>
          <input type="range" id="qualityRange" min="10" max="100" value="80" class="w-full accent-blue-600 mt-2" />
        </div>
      </div>

      <div id="previewContainer" class="hidden border-t pt-4">
        <div class="flex flex-col sm:flex-row gap-4 items-center mb-4">
          <img id="imagePreview" class="max-h-48 rounded border shadow-sm object-contain" />
          <div class="text-sm space-y-1">
            <p><strong>Ukuran Asli:</strong> <span id="origSize">-</span></p>
            <p><strong>Ukuran Baru:</strong> <span id="newSize" class="text-emerald-600 font-semibold">-</span></p>
          </div>
        </div>

        <button id="downloadBtn" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg hover:bg-emerald-700 transition shadow">
          Unduh Hasil Gambar
        </button>
      </div>
    </div>
  </main>

  <footer class="text-center text-xs text-slate-400 py-4">
    Aplikasi Desktop gegedigi.com - Proses 100% lokal tanpa upload ke internet
  </footer>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropArea = document.getElementById('dropArea');
    const formatSelect = document.getElementById('formatSelect');
    const widthInput = document.getElementById('widthInput');
    const qualityRange = document.getElementById('qualityRange');
    const qualityLabel = document.getElementById('qualityLabel');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const origSize = document.getElementById('origSize');
    const newSize = document.getElementById('newSize');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentFile = null;
    let processedBlob = null;

    dropArea.addEventListener('click', () => fileInput.click());
    dropArea.addEventListener('dragover', (e) => e.preventDefault());
    dropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    qualityRange.addEventListener('input', (e) => {
      qualityLabel.textContent = `${e.target.value}%`;
      processImage();
    });

    formatSelect.addEventListener('change', processImage);
    widthInput.addEventListener('input', processImage);

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
    }

    function handleFile(file) {
      if (!file.type.startsWith('image/')) return alert('Pilih file gambar!');
      currentFile = file;
      origSize.textContent = formatBytes(file.size);
      processImage();
    }

    function processImage() {
      if (!currentFile) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let targetWidth = parseInt(widthInput.value) || img.width;
          let targetHeight = (img.height / img.width) * targetWidth;

          canvas.width = targetWidth;
          canvas.height = targetHeight;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

          const mimeType = formatSelect.value;
          const quality = parseInt(qualityRange.value) / 100;

          canvas.toBlob((blob) => {
            processedBlob = blob;
            imagePreview.src = URL.createObjectURL(blob);
            newSize.textContent = formatBytes(blob.size);
            previewContainer.classList.remove('hidden');
          }, mimeType, quality);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(currentFile);
    }

    downloadBtn.addEventListener('click', () => {
      if (!processedBlob) return;
      const ext = formatSelect.value === 'image/jpeg' ? 'jpg' : formatSelect.value === 'image/webp' ? 'webp' : 'png';
      const link = document.createElement('a');
      link.href = URL.createObjectURL(processedBlob);
      link.download = `gegedigi-result.${ext}`;
      link.click();
    });
  </script>
</body>
</html>
