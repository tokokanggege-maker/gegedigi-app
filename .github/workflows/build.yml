name: Build Windows Single Installer

on:
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Package JSON and Main Script
        shell: pwsh
        run: |
          @'
          {
            "name": "gegedigi-studio",
            "productName": "GegeDigi Studio",
            "version": "1.0.0",
            "main": "main.js",
            "author": "gegedigi",
            "description": "GegeDigi Image Studio Tool",
            "scripts": {
              "dist": "electron-builder --win --x64"
            },
            "build": {
              "appId": "com.gegedigi.studio",
              "win": {
                "target": "nsis"
              },
              "nsis": {
                "oneClick": true,
                "perMachine": false,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "runAfterFinish": true
              }
            }
          }
          '@ | Set-Content -Path package.json -Encoding utf8

          @'
          const { app, BrowserWindow } = require('electron');
          function createWindow () {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              autoHideMenuBar: true
            });
            win.loadFile('index.html');
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          '@ | Set-Content -Path main.js -Encoding utf8

      - name: Install Dependencies
        shell: pwsh
        run: |
          npm install electron@28.2.0 electron-builder@24.13.3 --save-dev

      - name: Build Installer
        shell: pwsh
        run: |
          npm run dist

      - name: Upload Single Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: GegeDigi-Studio-Setup
          path: dist/*.exe
