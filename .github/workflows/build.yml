name: Build Windows Single Installer

on:
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Package and Config
        run: |
          cat << 'EOF' > package.json
          {
            "name": "gegedigi-studio",
            "productName": "GegeDigi Studio",
            "version": "1.0.0",
            "main": "main.js",
            "scripts": {
              "build": "electron-builder --win nsis"
            },
            "build": {
              "appId": "com.gegedigi.studio",
              "win": {
                "target": "nsis"
              },
              "nsis": {
                "oneClick": true,
                "perMachine": false,
                "allowToChangeInstallationDirectory": false,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "runAfterFinish": true
              }
            }
          }
          EOF
          cat << 'EOF' > main.js
          const { app, BrowserWindow } = require('electron');
          function createWindow () {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              autoHideMenuBar: true
            });
            win.loadFile('index.html');
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

      - name: Install Dependencies
        run: |
          npm install electron@28.2.0 electron-builder@24.13.3 --save-dev

      - name: Build Single Setup Exe
        run: |
          npm run build

      - name: Upload Single Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: GegeDigi-Studio-Setup-Installer
          path: dist/*.exe
