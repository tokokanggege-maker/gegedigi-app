name: Build Windows Single Installer

on:
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Setup Electron Files
        run: |
          cat << 'EOF' > package.json
          {
            "name": "gegedigi-studio",
            "version": "1.0.0",
            "main": "main.js"
          }
          EOF
          cat << 'EOF' > main.js
          const { app, BrowserWindow } = require('electron');
          function createWindow () {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              autoHideMenuBar: true
            });
            win.loadFile('index.html');
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

      - name: Build Electron App
        run: |
          npm install electron@28.2.0 @electron/packager@18.3.1 --save-dev
          npx @electron/packager . "GegeDigi-Studio" --platform=win32 --arch=x64 --out=dist --overwrite

      - name: Create One-Click Installer Script
        run: |
          cat << 'EOF' > installer.nsi
          !include "MUI2.nsh"

          Name "GegeDigi Studio"
          OutFile "GegeDigi-Studio-Setup.exe"
          InstallDir "$LOCALAPPDATA\GegeDigiStudio"
          RequestExecutionLevel user

          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          Section "Install"
            SetOutPath "$INSTDIR"
            File /r "dist/GegeDigi-Studio-win32-x64/*.*"
            CreateShortcut "$DESKTOP\GegeDigi Studio.lnk" "$INSTDIR\GegeDigi-Studio.exe"
            CreateDirectory "$SMPROGRAMS\GegeDigi Studio"
            CreateShortcut "$SMPROGRAMS\GegeDigi Studio\GegeDigi Studio.lnk" "$INSTDIR\GegeDigi-Studio.exe"
            Exec '"$INSTDIR\GegeDigi-Studio.exe"'
          SectionEnd
          EOF

      - name: Compile NSIS Installer
        run: |
          makensis installer.nsi

      - name: Upload Single Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: GegeDigi-Studio-Setup
          path: GegeDigi-Studio-Setup.exe
