name: Build Windows Exe

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Electron Files
        run: |
          cat << 'EOF' > package.json
          {
            "name": "gegedigi-image-tools",
            "version": "1.0.0",
            "main": "main.js"
          }
          EOF
          cat << 'EOF' > main.js
          const { app, BrowserWindow } = require('electron');
          function createWindow () {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              autoHideMenuBar: true
            });
            win.loadFile('index.html');
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

      - name: Install Packager
        run: |
          npm install electron@28.2.0 @electron/packager@18.3.1 --save-dev

      - name: Build Windows Executable
        run: |
          npx @electron/packager . "GegeDigi-Studio" --platform=win32 --arch=x64 --out=dist --overwrite

      - name: Archive to ZIP
        run: |
          cd dist
          zip -r ../GegeDigi-Studio-Windows.zip GegeDigi-Studio-win32-x64/
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GegeDigi-Studio-Windows-Exe
          path: GegeDigi-Studio-Windows.zip
